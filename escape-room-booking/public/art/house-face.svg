<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- Abandoned House: Lola’s face, flickered in over the veiled figure by the page -->
  <defs>
    <radialGradient id="face" cx="48%" cy="40%" r="62%"><stop offset="0" stop-color="#efe3ca"/><stop offset="0.7" stop-color="#c4ae8b"/><stop offset="1" stop-color="#8f7a5c"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f6ead0" stop-opacity="0.5"/><stop offset="1" stop-color="#f6ead0" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="tone"><feColorMatrix values="0.9 0.12 0 0 0.02  0.04 0.78 0.04 0 0.005  0.03 0.08 0.52 0 0  0 0 0 1 0"/></filter>
  </defs>
  <g filter="url(#tone)">
    <ellipse cx="400" cy="162" rx="92" ry="100" fill="url(#halo)"/>
    <g filter="url(#soft)">
      <!-- grey hair pulled back into a bun, parted in the middle -->
      <circle cx="400" cy="104" r="17" fill="#8e8270"/>
      <path d="M364 160 C360 126 378 112 400 112 C422 112 440 126 436 160 C430 140 418 130 400 130 C382 130 370 140 364 160 Z" fill="#9a8e7b"/>
      <path d="M400 114 V132" stroke="#5e5444" stroke-width="2"/>
      <!-- the face -->
      <path d="M368 162 C366 134 382 122 400 122 C418 122 434 134 432 162 C431 192 418 212 400 212 C382 212 369 192 368 162 Z" fill="url(#face)"/>
      <ellipse cx="380" cy="184" rx="7" ry="10" fill="#7d6849" opacity="0.35"/><ellipse cx="420" cy="184" rx="7" ry="10" fill="#7d6849" opacity="0.35"/>
      <!-- sunken eyes looking straight out -->
      <ellipse cx="387" cy="160" rx="8.5" ry="6.5" fill="#2c1e13" filter="url(#b2)"/><ellipse cx="413" cy="160" rx="8.5" ry="6.5" fill="#2c1e13" filter="url(#b2)"/>
      <circle cx="388" cy="160" r="1.4" fill="#f5ecd8"/><circle cx="414" cy="160" r="1.4" fill="#f5ecd8"/>
      <path d="M400 166 C398 176 396 182 401 184" stroke="#7a6446" stroke-width="1.6" fill="none"/>
      <!-- the smile -->
      <path d="M383 194 Q400 205 417 194" stroke="#3a2a1c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M378 140 Q400 134 422 140 M380 200 Q376 190 377 182 M420 200 Q424 190 423 182" stroke="#8a7456" stroke-width="1" fill="none" opacity="0.7"/>
      <!-- high dark collar -->
      <path d="M380 208 C386 214 414 214 420 208 L430 232 C414 240 386 240 370 232 Z" fill="#2a2119"/>
    </g>
  </g>
</svg>
