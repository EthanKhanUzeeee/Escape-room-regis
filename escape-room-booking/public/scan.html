<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2225">
<title>Door Scanner</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/staff-theme.js"></script>
</head>
<body class="scan">

<div class="scan-login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path class="dial-pointer" d="M16 1 L18.8 5 H13.2 Z"/><g class="dial-face"><circle class="dial-rim" cx="16" cy="18" r="12.2"/><circle class="dial-ticks" cx="16" cy="18" r="10.2" pathLength="40"/><circle class="dial-major" cx="16" cy="18" r="9.8" pathLength="10"/><circle class="dial-knob" cx="16" cy="18" r="5.4"/><circle class="dial-grip" cx="16" cy="18" r="5.4" pathLength="24"/><circle class="dial-cap" cx="16" cy="18" r="1.9"/><circle class="dial-cap" cx="16" cy="14.2" r="0.9"/></g></svg><span>Door scanner</span></span>
    <h1>Sign in</h1>
    <p class="small muted">Use the staff password.</p>
    <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
    <p class="form-error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<div class="scan-app" id="appView" hidden>
  <div class="scan-top">
    <span><strong id="nowLabel">Door scanner</strong> <span id="nowSub"></span></span>
    <span class="scan-top-actions"><a href="/staff">Dashboard</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" title="Light or dark"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></span>
  </div>

  <div class="scan-stage">
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-frame" aria-hidden="true"></div>
    <p class="scan-msg" id="scanMsg" role="status">Starting the camera…</p>

    <section class="scan-panel" id="searchPanel" hidden aria-label="Search bookings">
      <div class="field">
        <label for="searchBox">Find a booking without a QR code</label>
        <input id="searchBox" type="search" placeholder="Team, player or leader name, or booking code" autocomplete="off">
      </div>
      <div class="result-list" id="results"></div>
    </section>

    <section class="scan-panel" id="standbyPanel" hidden aria-label="Standby list">
      <h2 class="section-title">Open spots</h2>
      <div class="open-spots" id="spots"></div>
      <h2 class="section-title">Waiting on standby</h2>
      <div class="wl-list" id="waiting"></div>
      <p class="small muted">Add walk-ins and give refunds from the dashboard's Standby tab.</p>
    </section>

    <section class="scan-sheet" id="sheet" hidden aria-live="polite"></section>
  </div>

  <nav class="scan-tabs" role="tablist" aria-label="Scanner sections">
    <button type="button" role="tab" data-view="scan" aria-selected="true">Scan</button>
    <button type="button" role="tab" data-view="search" aria-selected="false">Search</button>
    <button type="button" role="tab" data-view="standby" aria-selected="false">Standby</button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>
<script src="/vendor/jsQR.js"></script>
<script src="/static/common.js"></script>
<script src="/static/shared.js"></script>
<script src="/static/staff-common.js"></script>
<script src="/static/scan.js"></script>
</body>
</html>
